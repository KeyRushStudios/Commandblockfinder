name: Build Plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Plugin bauen
        run: mvn -B package
      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CommandBlockFinder
          path: target/*.jar
